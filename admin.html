<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Global Mart BD – Admin</title>
<style>
:root{--bg:#FFF8FA;--surface:#fff;--ink:#2B1238;--muted:#6F5A7B;--brand:#B5256F;--onbrand:#fff;--line:#EBD5E0;--soft:#F8E3EC;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1A0E22;--surface:#251433;--ink:#F6E9F1;--muted:#BBA3C6;--brand:#E2569B;--onbrand:#1A0E22;--line:#47305E;--soft:#34204A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
.box{max-width:380px;margin:12vh auto;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
h1{font-size:22px;margin:0 0 10px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.pri{background:var(--brand);color:var(--onbrand);border:0;border-radius:10px;padding:11px 18px;font-weight:600;width:100%;margin-top:16px}
.pri:disabled,.sb:disabled{opacity:.5}
.err{color:#C0264B;min-height:22px;margin:8px 0 0}
@media (prefers-color-scheme:dark){.err{color:#FF8FAE}}
.muted{color:var(--muted);font-size:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
header b{flex:1;font-size:18px}
.sm{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-size:20px}.stat span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin:6px 0 2px;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{color:#fff;border-radius:999px;padding:1px 12px;font-size:14px;font-weight:600;background:#6B7280}
.badge.new,.sb.new{background:#2563EB}.badge.confirmed,.sb.confirmed{background:#B45309}.badge.shipped,.sb.shipped{background:#7C3AED}.badge.delivered,.sb.delivered{background:#15803D}.badge.cancelled,.sb.cancelled{background:#B91C1C}
ul{margin:8px 0;padding-left:20px}
.note{background:var(--soft);border-radius:8px;padding:6px 10px;margin:6px 0}
.sum{margin:8px 0;font-size:15px}
.acts,.sts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ca{border:1px solid var(--line);border-radius:8px;padding:7px 12px;text-decoration:none;color:inherit;background:var(--bg)}
.sb{border:0;color:#fff;border-radius:8px;padding:7px 12px;font-weight:600}
.seg{display:flex;gap:8px;padding-top:0}
.tb{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:600}
.tb[aria-pressed="true"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.add{margin:14px 0}
.prow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.prow img,.ph{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--soft)}
.pb{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pvw{width:120px;height:120px;object-fit:cover;border-radius:8px;margin-top:8px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
</style>
</head>
<body>
<div id="login" class="box" hidden>
<h1>Global Mart BD Admin</h1>
<p class="muted">Only the shop owner can sign in here.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button class="pri" id="go">Sign in</button>
<p class="err" id="lm" role="alert"></p>
</div>

<div id="app" hidden>
<header><div class="wrap"><b>Admin</b><button class="sm" id="rf">Refresh</button><button class="sm" id="lo">Sign out</button></div><div class="wrap seg"><button class="tb" id="t1" aria-pressed="true">Orders</button><button class="tb" id="t2" aria-pressed="false">Products</button></div></header>
<div class="wrap" id="v1">
<div class="stats" id="stats"></div>
<input id="q" type="search" placeholder="Search name, phone or order number" aria-label="Search orders">
<div class="tabs" id="tabs"></div>
<p class="err" id="am" role="alert"></p>
<div id="list"></div>
</div>
<div class="wrap" id="v2" hidden>
<button class="pri add" id="addp">+ Add new product</button>
<p class="err" id="pm" role="alert"></p>
<div id="imp" hidden><p class="muted">No products are saved in the database yet. Import the products already on your website so you can manage them here.</p><button class="pri" id="impb">Import current website products</button></div>
<div id="plist"></div>
<div id="pform" class="card" hidden>
<h3 id="pft">Add product</h3>
<label for="f_n">Product name</label><input id="f_n">
<label for="f_c">Category</label><input id="f_c" list="cats"><datalist id="cats"><option>Skincare</option><option>Makeup</option><option>Hair</option><option>Fragrance</option></datalist>
<label for="f_p">Price (৳)</label><input id="f_p" inputmode="numeric">
<label for="f_o">Old price (৳, optional)</label><input id="f_o" inputmode="numeric">
<label for="f_s">Size (optional, like 80ml)</label><input id="f_s">
<label for="f_t">Tag (optional, like Offer)</label><input id="f_t">
<label for="f_i">Photo</label><input id="f_i" type="file" accept="image/*"><img id="f_pv" class="pvw" alt="" hidden>
<label for="f_d">Description</label><textarea id="f_d" rows="9"></textarea>
<label for="f_r">Order (optional, a small number shows first)</label><input id="f_r" inputmode="numeric">
<label class="chk"><input type="checkbox" id="f_a"> Show on website</label>
<p class="err" id="fm" role="alert"></p>
<div class="acts"><button class="pri" id="fs" style="width:auto">Save product</button><button class="sm" id="fc">Cancel</button></div>
</div>
</div>
</div>

<script>
var URL_ = "https://hsipmhauiduiwjjngiqp.supabase.co";
var KEY = "sb_publishable_M8L0wMDtLTe62YDdlG2oIQ_BGBmruCW";
var S = ["new","confirmed","shipped","delivered","cancelled"];
var LBL = {new:"New",confirmed:"Confirmed",shipped:"Shipped",delivered:"Delivered",cancelled:"Cancelled"};
var sess = null, orders = [], filter = "all", q = "";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function money(n){return "৳"+Number(n||0).toLocaleString("en-US")}
function digits(p){return String(p||"").replace(/\D/g,"")}
function waNum(p){var d=digits(p);return d.indexOf("880")===0?d:(d.charAt(0)==="0"?"88"+d:"880"+d)}
function when(t){try{return new Date(t).toLocaleString("en-GB",{timeZone:"Asia/Dhaka",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true})}catch(e){return ""}}
function show(app){$("login").hidden=app;$("app").hidden=!app}

function loadSess(){try{sess=JSON.parse(localStorage.getItem("gmbd_admin")||"null")}catch(e){sess=null}}
function saveSess(){try{if(sess)localStorage.setItem("gmbd_admin",JSON.stringify(sess));else localStorage.removeItem("gmbd_admin")}catch(e){}}
function setSess(d){sess={at:d.access_token,rt:d.refresh_token,exp:Date.now()+(Number(d.expires_in||3600)-60)*1000};saveSess()}
function logout(){sess=null;orders=[];saveSess();show(false)}

async function auth(body,grant){
  var r=await fetch(URL_+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify(body)});
  var d=await r.json().catch(function(){return {}});
  if(!r.ok)throw new Error(d.error_description||d.msg||"Sign in failed");
  return d;
}
async function token(){
  if(!sess)throw new Error("Please sign in.");
  if(Date.now()>sess.exp){try{setSess(await auth({refresh_token:sess.rt},"refresh_token"))}catch(e){logout();throw new Error("Session expired. Please sign in again.")}}
  return sess.at;
}
async function api(path,opt){
  var t=await token();opt=opt||{};
  opt.headers=Object.assign({apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},opt.headers||{});
  var r=await fetch(URL_+"/rest/v1/"+path,opt);
  var d=await r.json().catch(function(){return null});
  if(!r.ok){if(r.status===401){logout();throw new Error("Session expired. Please sign in again.")}throw new Error((d&&d.message)||("Request failed ("+r.status+")"))}
  return d;
}

function stat(a,b){return "<div class='stat'><b>"+esc(b)+"</b><span>"+esc(a)+"</span></div>"}
function card(o){
  var items=Array.isArray(o.items)?o.items:[],d=digits(o.phone),st=S.indexOf(o.status)>-1?o.status:"";
  var btns=S.filter(function(s){return s!==o.status}).map(function(s){return "<button class='sb "+s+"' data-id='"+esc(o.id)+"' data-st='"+s+"'>"+LBL[s]+"</button>"}).join("");
  return "<article class='card'><div class='top'><b>"+esc(o.order_no)+"</b><span class='badge "+st+"'>"+esc(LBL[o.status]||o.status)+"</span></div>"
   +"<div class='muted'>"+esc(when(o.created_at))+"</div>"
   +"<h3>"+esc(o.name)+"</h3><div>"+esc(o.address)+(o.area?" ("+esc(o.area)+")":"")+"</div>"
   +"<ul>"+items.map(function(i){return "<li>"+esc(i.qty)+" × "+esc(i.name)+" <span class='muted'>"+money(Number(i.price)*Number(i.qty))+"</span></li>"}).join("")+"</ul>"
   +(o.note?"<div class='note'>Note: "+esc(o.note)+"</div>":"")
   +"<div class='sum'>Subtotal "+money(o.subtotal)+" · Delivery "+(Number(o.delivery)?money(o.delivery):"Free")+" · <b>Total "+money(o.total)+"</b> · "+esc(o.payment||"")+"</div>"
   +"<div class='acts'><a class='ca' href='tel:"+(d.charAt(0)==="0"?"+88"+d:"+"+d)+"'>Call "+esc(o.phone)+"</a><a class='ca' target='_blank' rel='noopener' href='https://wa.me/"+waNum(o.phone)+"'>WhatsApp</a></div>"
   +"<div class='sts'>"+btns+"</div></article>";
}
function render(){
  var c={all:orders.length};S.forEach(function(s){c[s]=0});
  orders.forEach(function(o){if(c[o.status]!==undefined)c[o.status]++});
  var sales=orders.filter(function(o){return o.status==="delivered"}).reduce(function(a,o){return a+Number(o.total||0)},0);
  $("stats").innerHTML=stat("New orders",c["new"])+stat("Confirmed",c.confirmed)+stat("Delivered",c.delivered)+stat("Delivered sales",money(sales));
  $("tabs").innerHTML=["all"].concat(S).map(function(s){return "<button class='tab' aria-pressed='"+(s===filter)+"' data-f='"+s+"'>"+(s==="all"?"All":LBL[s])+" ("+c[s]+")</button>"}).join("");
  var l=orders.filter(function(o){if(filter!=="all"&&o.status!==filter)return false;if(!q)return true;return (o.order_no+" "+o.name+" "+o.phone).toLowerCase().indexOf(q)>-1});
  $("list").innerHTML=l.length?l.map(card).join(""):"<p class='muted'>No orders here yet.</p>";
}
async function fetchOrders(quiet){
  try{orders=await api("gm_orders?select=*&order=created_at.desc&limit=500");$("am").textContent="";render()}
  catch(e){if(!quiet)$("am").textContent=e.message}
}
async function setStatus(id,st,btn){
  if(st==="cancelled"&&!confirm("Cancel this order?"))return;
  btn.disabled=true;$("am").textContent="";
  try{
    var r=await api("gm_orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({status:st})});
    if(!r||!r.length)throw new Error("Not saved. Check the admin policies in Supabase.");
    orders.forEach(function(o){if(String(o.id)===String(id))o.status=st});render();
  }catch(e){$("am").textContent=e.message;btn.disabled=false}
}
function start(){show(true);tab("orders");fetchOrders(false)}

$("go").onclick=async function(){
  var b=this;$("lm").textContent="";b.disabled=true;
  try{setSess(await auth({email:$("em").value.trim(),password:$("pw").value},"password"));$("pw").value="";start()}
  catch(e){$("lm").textContent=e.message}
  b.disabled=false;
};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("lo").onclick=logout;
$("rf").onclick=function(){if(view==="products")fetchProds();else fetchOrders(false)};
$("q").oninput=function(e){q=e.target.value.toLowerCase().trim();render()};
$("tabs").onclick=function(e){var f=e.target.dataset.f;if(f){filter=f;render()}};
$("list").onclick=function(e){var b=e.target.closest("button[data-st]");if(b)setStatus(b.dataset.id,b.dataset.st,b)};

var prods=[],editing=null,view="orders";
function tab(v){view=v;$("v1").hidden=v!=="orders";$("v2").hidden=v!=="products";$("t1").setAttribute("aria-pressed",v==="orders");$("t2").setAttribute("aria-pressed",v==="products");if(v==="products")fetchProds()}
$("t1").onclick=function(){tab("orders")};$("t2").onclick=function(){tab("products")};
async function fetchProds(){try{prods=await api("gm_products?select=*&order=sort.asc,id.asc");$("pm").textContent="";rProds()}catch(e){$("pm").textContent=e.message}}
function pcard(p){return "<article class='card prow'>"+(p.image_url?"<img src='"+esc(p.image_url)+"' alt=''>":"<div class='ph'></div>")+"<div><b>"+esc(p.name)+"</b><div class='muted'>"+esc(p.category)+" · "+money(p.price)+(p.old_price?" (was "+money(p.old_price)+")":"")+"</div><span class='badge "+(p.active?"delivered":"cancelled")+"'>"+(p.active?"Visible":"Hidden")+"</span></div><div class='pb'><button class='sm' data-e='"+p.id+"'>Edit</button><button class='sm' data-v='"+p.id+"'>"+(p.active?"Hide":"Show")+"</button><button class='sm' data-x='"+p.id+"'>Delete</button></div></article>"}
function rProds(){$("imp").hidden=prods.length>0||!$("pform").hidden;$("plist").innerHTML=prods.map(pcard).join("")}
function byId(id){return prods.filter(function(x){return String(x.id)===String(id)})[0]}
function openForm(p){editing=p||null;$("pft").textContent=p?"Edit product":"Add product";
  $("f_n").value=p?p.name:"";$("f_c").value=p?p.category:"Skincare";$("f_p").value=p?p.price:"";$("f_o").value=(p&&p.old_price)||"";$("f_s").value=(p&&p.size)||"";$("f_t").value=(p&&p.tag)||"";$("f_d").value=(p&&p.description)||"";$("f_r").value=p?p.sort:0;$("f_a").checked=p?p.active:true;$("f_i").value="";
  var pv=$("f_pv");if(p&&p.image_url){pv.src=p.image_url;pv.hidden=false}else pv.hidden=true;
  $("fm").textContent="";$("pform").hidden=false;$("plist").hidden=true;$("addp").hidden=true;$("imp").hidden=true;$("pform").scrollIntoView()}
function closeForm(){$("pform").hidden=true;$("plist").hidden=false;$("addp").hidden=false;rProds()}
$("addp").onclick=function(){openForm(null)};$("fc").onclick=closeForm;
$("f_i").onchange=function(){var f=this.files[0];if(f){$("f_pv").src=URL.createObjectURL(f);$("f_pv").hidden=false}};

function resize(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var m=Math.max(im.width,im.height),side=Math.min(900,m),sc=side/m,c=document.createElement("canvas");c.width=c.height=side;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,side,side);var w=im.width*sc,hh=im.height*sc;x.drawImage(im,(side-w)/2,(side-hh)/2,w,hh);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("Could not read the photo"))},"image/jpeg",.84)};
  im.onerror=function(){rej(new Error("Could not read the photo"))};im.src=u})}
async function upload(blob){var t=await token(),name=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
  var r=await fetch(URL_+"/storage/v1/object/product-images/"+name,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"image/jpeg"},body:blob});
  var d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.message||"Photo upload failed");
  return URL_+"/storage/v1/object/public/product-images/"+name}

$("fs").onclick=async function(){var b=this,m=$("fm");m.textContent="";
  var name=$("f_n").value.trim(),price=parseInt($("f_p").value,10),old=parseInt($("f_o").value,10);
  if(!name){m.textContent="Enter the product name.";return}
  if(!(price>0)){m.textContent="Enter the price as a number.";return}
  b.disabled=true;b.textContent="Saving…";
  try{var url=editing?editing.image_url:null,f=$("f_i").files[0];if(f)url=await upload(await resize(f));
    var row={name:name,category:$("f_c").value.trim()||"Skincare",price:price,old_price:old>0?old:null,size:$("f_s").value.trim()||null,tag:$("f_t").value.trim()||null,image_url:url||null,description:$("f_d").value.trim()||null,active:$("f_a").checked,sort:parseInt($("f_r").value,10)||0};
    var r=await api(editing?"gm_products?id=eq."+editing.id:"gm_products",{method:editing?"PATCH":"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(row)});
    if(!r||!r.length)throw new Error("Not saved. Check the admin policies in Supabase.");
    await fetchProds();closeForm()}
  catch(e){m.textContent=e.message}
  b.disabled=false;b.textContent="Save product"};

$("plist").onclick=async function(e){var d=e.target.dataset,btn=e.target;
  try{
    if(d.e){openForm(byId(d.e))}
    else if(d.v){var p=byId(d.v);btn.disabled=true;await api("gm_products?id=eq."+p.id,{method:"PATCH",body:JSON.stringify({active:!p.active})});await fetchProds()}
    else if(d.x){var q2=byId(d.x);if(!confirm("Delete "+q2.name+"? This cannot be undone."))return;btn.disabled=true;await api("gm_products?id=eq."+q2.id,{method:"DELETE"});await fetchProds()}
  }catch(er){$("pm").textContent=er.message;btn.disabled=false}};

$("impb").onclick=async function(){var b=this;b.disabled=true;$("pm").textContent="Importing, please wait…";
  try{var txt=await (await fetch("index.html",{cache:"no-store"})).text();
    var L=txt.split("\n").filter(function(l){return /^\{"id": \d+,/.test(l)});
    if(!L.length)throw new Error("Could not find the products. Keep admin.html and index.html in the same folder.");
    for(var i=0;i<L.length;i++){var p=JSON.parse(L[i].replace(/,\s*$/,"")),url=null;
      if(p.img)url=await upload(await (await fetch(p.img)).blob());
      await api("gm_products",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({name:p.n,category:p.c,price:p.p,old_price:p.o||null,size:p.size||null,tag:p.tag||null,image_url:url,description:p.d||null,active:true,sort:i})})}
    $("pm").textContent="";await fetchProds()}
  catch(e){$("pm").textContent=e.message}
  b.disabled=false};
setInterval(function(){if(sess&&!document.hidden&&!$("app").hidden)fetchOrders(true)},60000);

loadSess();
if(sess)start();else show(false);
</script>
</body>
</html>
